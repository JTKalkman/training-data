server {
    server_name trainingsdata.jtkalkman.nl;
    root /var/www/trainingsdata/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/trainingsdata.jtkalkman.nl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/trainingsdata.jtkalkman.nl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = trainingsdata.jtkalkman.nl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name trainingsdata.jtkalkman.nl;
    return 404; # managed by Certbot


}
